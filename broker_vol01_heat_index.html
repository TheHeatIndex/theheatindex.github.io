  .hi-date { font-size: 1.4rem; font-weight: 800; color: var(--text); }

  .key-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-right: 2px; flex-shrink: 0; }
  .key-item { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); cursor: pointer; padding: 3px 10px; border-radius: 14px; border: 0.5px solid transparent; transition: all 0.18s; white-space: nowrap; }

  .key-item.active { background: var(--tag-bg2); color: var(--text); border-color: var(--border); }
  .key-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-dominant { background: var(--text); }
  .dot-fire { background: #00e8a2; }
  .dot-rising { background: #f7c948; }
  .dot-power { background: #c084fc; }
  .dot-legacy { background: transparent; border: 1.5px solid var(--muted); }

  .entries { padding: 0; }
  .entry { border-bottom: 0.5px solid var(--border); cursor: pointer; transition: background 0.12s; }
  .entry:hover { background: var(--card-bg); }
  .entry-main { display: grid; grid-template-columns: 3.5rem 1fr auto; gap: 0; align-items: start; padding: 1.4rem 2rem; }
  .entry-num { font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight: 900; color: var(--num-color); line-height: 1; padding-top: 3px; font-variant-numeric: tabular-nums; }

  .entry-name { font-size: clamp(1.05rem, 2.8vw, 1.5rem); font-weight: 800; text-transform: uppercase; letter-spacing: 0.035em; color: var(--text); line-height: 1.1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .entry-meta { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 5px 0 0.55rem; }
  .entry-blurb { font-size: 13px; color: var(--muted); line-height: 1.6; font-style: italic; }
  .entry-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .entry-badge { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 58px; text-align: center; }
  .badge-dot { width: 9px; height: 9px; border-radius: 50%; }
  .badge-label { font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); line-height: 1.25; }
  .chevron { font-size: 12px; color: var(--muted); transition: transform 0.28s; margin-top: 4px; }

  .entry-expand { overflow: hidden; max-height: 0; transition: max-height 0.38s ease; }
  .entry-expand.open { max-height: 600px; }
  .expand-inner { padding: 0 2rem 1.8rem; padding-left: calc(3.5rem + 0.8rem + 2rem); display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .expand-block { background: var(--expand-bg); border-radius: 10px; padding: 0.85rem 1rem; border: 0.5px solid var(--border); }
  .expand-block-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 5px; }
  .expand-block-text { font-size: 12.5px; color: var(--text); line-height: 1.6; }

  .hi-footer { padding: 1.1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-top: 0.5px solid var(--border); }
  .hi-footer-text { font-size: 10.5px; color: var(--muted); }

let activeFilter = "all";

function toggleMode() {

function setFilter(f, el) {

  renderEntries();
}

    const cfg = BADGE_CONFIG[b.badge];
    const isLegacy = b.badge === "legacy";
    const dotExtra = isLegacy ? "style=\"background:transparent;border:1.5px solid var(--muted);\"" : "";
    const detailBlocks = Object.entries(b.details).map(([k,v]) => `
      <div class="expand-block">
        <div class="expand-block-label">${k}</div>
        <div class="expand-block-text">${v}</div>
      </div>`).join("");
    return `
    <div class="entry" onclick="toggleExpand(${b.rank})">
      <div class="entry-main">
        <div class="entry-num">${b.rank}</div>
        <div class="entry-body">
          <div class="entry-name">
            ${b.name}
            ${b.tie ? '<span class="tie-tag">Tie</span>' : ""}
          </div>
          <div class="entry-meta">${b.meta}</div>
          <div class="entry-blurb">${b.blurb}</div>
        </div>
        <div class="entry-right">
          <div class="entry-badge">
            <div class="badge-dot ${cfg.dotClass}" ${dotExtra}></div>
            <div class="badge-label">${cfg.label}</div>
          </div>
          <div class="chevron" id="chev-${b.rank}">▼</div>
        </div>
      </div>
      <div class="entry-expand" id="exp-${b.rank}">
        <div class="expand-inner">${detailBlocks}</div>
      </div>
    </div>`;
  }).join("");
}

function toggleExpand(rank) {
  const panel = document.getElementById(`exp-${rank}`);
  const chev  = document.getElementById(`chev-${rank}`);
  const isOpen = panel.classList.contains("open");
  document.querySelectorAll(".entry-expand").forEach(p => p.classList.remove("open"));
  document.querySelectorAll(".chevron").forEach(c => c.classList.remove("open"));
  if (!isOpen) { panel.classList.add("open"); chev.classList.add("open"); }
}

renderEntries();
</script>
</body>
</html>
